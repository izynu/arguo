<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Arguo: the open research intelligence toolkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fafaf9">
        <animate attributeName="stop-color" values="#fafaf9;#86efac;#fafaf9" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#fafaf9"/>
      <stop offset="1" stop-color="#fafaf9"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22c55e" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#292524" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="300" fill="url(#bg)"/>
  <rect width="960" height="300" fill="url(#grid)"/>

  <rect x="0" y="0" width="960" height="46" fill="url(#scan)">
    <animate attributeName="y" values="0;254;0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="64" y="128" font-size="84" font-weight="bold" fill="url(#shimmer)" letter-spacing="6">ARGUO</text>
    <text x="66" y="164" font-size="21" fill="#a8a29e">The open research intelligence toolkit</text>
    <text x="66" y="200" font-size="14.5" fill="#78716c" font-family="Verdana, Geneva, sans-serif">Plans searches. Records evidence. Audits its own citations.</text>
  </g>

  <rect x="596" y="64" width="316" height="150" rx="10" fill="#111110" stroke="#292524" stroke-width="1.5"/>
  <g font-family="'Courier New', monospace" font-size="13.5">
    <text x="616" y="92" fill="#a8a29e">evidence ledger</text>
    <text x="616" y="122" fill="#d6d3d1">S1  primary   example.gov</text>
    <text x="616" y="146" fill="#d6d3d1">E1  passage  hash ok</text>
    <text x="616" y="170" fill="#d6d3d1">C1  claim    supported</text>
  </g>

  <circle cx="884" cy="117" r="11" fill="none" stroke="#22c55e" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M 878 117 L 882.5 121.5 L 891 112.5" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="26" stroke-dashoffset="26">
    <animate attributeName="stroke-dashoffset" values="26;0;0" keyTimes="0;0.28;1" dur="3s" repeatCount="indefinite"/>
  </path>

  <rect x="596" y="226" width="316" height="2" fill="url(#fadeL)"/>

  <g font-family="Verdana, Geneva, sans-serif" font-size="12" text-anchor="middle">
    <g>
      <circle cx="72" cy="240" r="14" fill="#15803d"/>
      <text x="72" y="244.5" fill="#fafaf9">A</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" begin="0s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="162" cy="240" r="14" fill="#166534"/>
      <text x="162" y="244.5" fill="#e7e5e4">B</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" begin="0.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="252" cy="240" r="14" fill="#166534"/>
      <text x="252" y="244.5" fill="#e7e5e4">C</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" begin="1s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="342" cy="240" r="14" fill="#166534"/>
      <text x="342" y="244.5" fill="#e7e5e4">D</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" begin="1.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="432" cy="240" r="14" fill="#166534"/>
      <text x="432" y="244.5" fill="#e7e5e4">E</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" begin="2s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="522" cy="240" r="14" fill="#166534"/>
      <text x="522" y="244.5" fill="#e7e5e4">F</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" begin="2.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="612" cy="240" r="14" fill="#166534"/>
      <text x="612" y="244.5" fill="#e7e5e4">G</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" begin="3s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="702" cy="240" r="14" fill="#166534"/>
      <text x="702" y="244.5" fill="#e7e5e4">H</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" begin="3.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="792" cy="240" r="14" fill="#166534"/>
      <text x="792" y="244.5" fill="#e7e5e4">I</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" begin="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="882" cy="240" r="14" fill="#166534"/>
      <text x="882" y="244.5" fill="#e7e5e4">J</text>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" begin="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="66" y="282" font-size="11" fill="#57534e" font-family="Verdana, Geneva, sans-serif">Apache-2.0 open source. Built by Zynu and Shraddha.</text>
</svg>

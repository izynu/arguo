<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-label="The ten stage Arguo pipeline, from intake A to reporting J">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#57534e"/>
    </marker>
  </defs>

  <rect width="960" height="220" rx="12" fill="url(#pbg)"/>
  <text x="480" y="36" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#e7e5e4">The ten stage pipeline</text>
  <text x="480" y="56" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="11.5" fill="#78716c">every stage writes observable artifacts and can be inspected on its own</text>

  <g font-family="Verdana, Geneva, sans-serif">
    <!-- connecting flow line -->
    <path d="M 96 108 H 864" fill="none" stroke="#292524" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 96 108 H 864" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.55"
          stroke-dasharray="14 776" stroke-dashoffset="790">
      <animate attributeName="stroke-dashoffset" values="790;-14" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- stage boxes -->
    <g text-anchor="middle">
      <g>
        <rect x="52" y="80" width="88" height="56" rx="9" fill="#14532d" stroke="#22c55e" stroke-width="1.6"/>
        <text x="96" y="106" font-size="16" font-weight="bold" fill="#fafaf9">A</text>
        <text x="96" y="124" font-size="10" fill="#dcfce7">Intake</text>
        <animate attributeName="opacity" values="1;0.55;1" dur="6s" begin="0s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="142" y="80" width="88" height="56" rx="9" fill="#1c1917" stroke="#44403c" stroke-width="1.4"/>
        <text x="186" y="106" font-size="16" font-weight="bold" fill="#e7e5e4">B</text>
        <text x="186" y="124" font-size="10" fill="#a8a29e">Planning</text>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="6s" begin="0.6s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="232" y="80" width="88" height="56" rx="9" fill="#1c1917" stroke="#44403c" stroke-width="1.4"/>
        <text x="276" y="106" font-size="16" font-weight="bold" fill="#e7e5e4">C</text>
        <text x="276" y="124" font-size="10" fill="#a8a29e">Search</text>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="6s" begin="1.2s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="322" y="80" width="88" height="56" rx="9" fill="#1c1917" stroke="#44403c" stroke-width="1.4"/>
        <text x="366" y="106" font-size="16" font-weight="bold" fill="#e7e5e4">D</text>
        <text x="366" y="124" font-size="10" fill="#a8a29e">Retrieval</text>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="6s" begin="1.8s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="412" y="80" width="88" height="56" rx="9" fill="#1c1917" stroke="#44403c" stroke-width="1.4"/>
        <text x="456" y="106" font-size="16" font-weight="bold" fill="#e7e5e4">E</text>
        <text x="456" y="124" font-size="10" fill="#a8a29e">Evidence</text>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="6s" begin="2.4s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="502" y="80" width="88" height="56" rx="9" fill="#1c1917" stroke="#44403c" stroke-width="1.4"/>
        <text x="546" y="106" font-size="16" font-weight="bold" fill="#e7e5e4">F</text>
        <text x="546" y="124" font-size="10" fill="#a8a29e">Gap scan</text>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="6s" begin="3s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="592" y="80" width="88" height="56" rx="9" fill="#1c1917" stroke="#44403c" stroke-width="1.4"/>
        <text x="636" y="106" font-size="16" font-weight="bold" fill="#e7e5e4">G</text>
        <text x="636" y="124" font-size="10" fill="#a8a29e">Verify</text>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="6s" begin="3.6s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="682" y="80" width="88" height="56" rx="9" fill="#1c1917" stroke="#44403c" stroke-width="1.4"/>
        <text x="726" y="106" font-size="16" font-weight="bold" fill="#e7e5e4">H</text>
        <text x="726" y="124" font-size="10" fill="#a8a29e">Synthesis</text>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="6s" begin="4.2s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="772" y="80" width="88" height="56" rx="9" fill="#1c1917" stroke="#44403c" stroke-width="1.4"/>
        <text x="816" y="106" font-size="16" font-weight="bold" fill="#e7e5e4">I</text>
        <text x="816" y="124" font-size="10" fill="#a8a29e">Claim audit</text>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="6s" begin="4.8s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="862" y="80" width="88" height="56" rx="9" fill="#14532d" stroke="#22c55e" stroke-width="1.6"/>
        <text x="906" y="106" font-size="16" font-weight="bold" fill="#fafaf9">J</text>
        <text x="906" y="124" font-size="10" fill="#dcfce7">Reporting</text>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="6s" begin="5.4s" repeatCount="indefinite"/>
      </g>
    </g>

    <text x="480" y="176" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#a8a29e">report.md  sources.json  evidence.json  audit.json  research_plan.json  manifest.json</text>
    <text x="480" y="200" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#57534e">six artifacts per run: the report cites identifiers that resolve into machine-readable files</text>
  </g>
</svg>
